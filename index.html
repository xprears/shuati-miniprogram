<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B4F9C">
<title>应急通信理论考核刷题</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 顶部导航 -->
  <header id="topbar">
    <button id="btn-back" class="icon-btn" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="topbar-title">应急通信刷题</div>
    <div id="topbar-extra"></div>
  </header>

  <!-- 主内容区 -->
  <main id="view"></main>

  <!-- 底部标签栏 -->
  <nav id="tabbar">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-tab="bank">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h16v3H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>分类</span>
    </button>
    <button class="tab" data-tab="wrong">
      <svg viewBox="0 0 24 24"><path d="M12 3l9.5 16.5H2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor"/></svg>
      <span>错题本</span>
    </button>
    <button class="tab" data-tab="report">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>报告</span>
    </button>
  </nav>

  <!-- 模态层 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
